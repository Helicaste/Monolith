- type: entity
  name: BaseWeaponHeavyMachineGun
  parent: BaseItem
  id: BaseWeaponHeavyMachineGun
  description: Spray and pray.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 20
    projectileSpeed: 55 # Mono
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: StaticPrice
    price: 500
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  # No chamber because HMG may want its own
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  # Goobstation edit end

  #Mono Edit
- type: entity
  name: minigun
  id: WeaponMinigun
  parent: BaseWeaponHeavyMachineGun
  description: Vzzzzzt! Rahrahrahrah! Vrrrrr! Uses 9x19mm FMJ ammo from a dedicated feed backpack.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
    layers:
    - state: icon
  - type: Item
    sprite: Objects/Weapons/Guns/HMGs/minigun.rsi
    size: Ginormous
  - type: Wieldable
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: Gun
    minAngle: 1.3
    maxAngle: 9
    angleIncrease: 0.4
    angleDecay: 16
    fireRate: 15
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/minigun.ogg
  - type: ClothingSlotAmmoProvider
    targetSlot: BACK
    providerWhitelist:
      tags:
      - MinigunAmmoBackpack
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: PirateBountyItem # Mono
    id: ExperimentalFactionWeapon
#Mono edit end
